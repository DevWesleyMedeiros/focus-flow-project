<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>FocusFlow - Sign In</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap');

      body {
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
      }

      /* Subtle focus glow for inputs as per design system */
      .input-focus-effect:focus-within {
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1);
      }

      /* Background texture for the "etched" look */
      .etched-surface {
        background-image: radial-gradient(
          circle at 2px 2px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 0
        );
        background-size: 24px 24px;
      }
    </style>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-primary': '#002e6a',
              'inverse-primary': '#005ac2',
              'outline-variant': '#424754',
              'on-tertiary': '#283044',
              'inverse-on-surface': '#263143',
              'tertiary-fixed-dim': '#bec6e0',
              'secondary-fixed': '#6ffbbe',
              'tertiary-fixed': '#dae2fd',
              'on-surface': '#d8e3fb',
              'surface-container': '#152031',
              'tertiary-container': '#8990a8',
              'primary-fixed': '#d8e2ff',
              'primary-fixed-dim': '#adc6ff',
              'on-primary-fixed-variant': '#004395',
              tertiary: '#bec6e0',
              'surface-container-low': '#111c2d',
              'on-tertiary-container': '#22293d',
              'on-secondary-fixed-variant': '#005236',
              'on-secondary-container': '#00311f',
              surface: '#081425',
              outline: '#8c909f',
              'on-background': '#d8e3fb',
              'surface-dim': '#081425',
              'on-primary-fixed': '#001a42',
              'primary-container': '#4d8eff',
              primary: '#adc6ff',
              'secondary-fixed-dim': '#4edea3',
              'surface-container-highest': '#2a3548',
              'surface-bright': '#2f3a4c',
              'surface-container-lowest': '#040e1f',
              'on-error': '#690005',
              'surface-variant': '#2a3548',
              'on-tertiary-fixed': '#131b2e',
              'secondary-container': '#00a572',
              'on-secondary-fixed': '#002113',
              error: '#ffb4ab',
              'on-error-container': '#ffdad6',
              'error-container': '#93000a',
              background: '#081425',
              'on-surface-variant': '#c2c6d6',
              'surface-container-high': '#1f2a3c',
              'inverse-surface': '#d8e3fb',
              'on-tertiary-fixed-variant': '#3f465c',
              'on-secondary': '#003824',
              'surface-tint': '#adc6ff',
              secondary: '#4edea3',
              'on-primary-container': '#00285d',
            },
            borderRadius: {
              DEFAULT: '0.25rem',
              lg: '0.5rem',
              xl: '0.75rem',
              full: '9999px',
            },
            spacing: {
              'section-gap': '48px',
              'container-margin': '32px',
              'sidebar-width-expanded': '240px',
              'sidebar-width-collapsed': '64px',
              gutter: '16px',
            },
            fontFamily: {
              'label-caps': ['Geist'],
              'body-lg': ['Geist'],
              'headline-md': ['Geist'],
              'body-sm': ['Geist'],
              'headline-lg-mobile': ['Geist'],
              'headline-lg': ['Geist'],
              'timer-display': ['Geist'],
            },
            fontSize: {
              'label-caps': [
                '12px',
                { lineHeight: '16px', letterSpacing: '0.05em', fontWeight: '600' },
              ],
              'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }],
              'headline-md': ['20px', { lineHeight: '28px', fontWeight: '600' }],
              'body-sm': ['14px', { lineHeight: '20px', fontWeight: '400' }],
              'headline-lg-mobile': ['24px', { lineHeight: '32px', fontWeight: '600' }],
              'headline-lg': [
                '32px',
                { lineHeight: '40px', letterSpacing: '-0.02em', fontWeight: '600' },
              ],
              'timer-display': [
                '80px',
                { lineHeight: '80px', letterSpacing: '-0.02em', fontWeight: '600' },
              ],
            },
          },
        },
      }
    </script>
  </head>
  <body
    class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center etched-surface selection:bg-primary-container selection:text-on-primary-container"
  >
    <!-- Top Branding Logo (External to the card for airiness) -->
    <header class="mb-12 animate-fade-in"></header>
    <!-- Main Auth Card -->
    <main class="w-full max-w-[420px] px-container-margin md:px-0">
      <div
        class="bg-surface-container border border-outline-variant p-8 md:p-10 rounded-xl shadow-2xl transition-all duration-300"
      >
        <!-- Header Section -->
        <div class="mb-10">
          <h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Welcome back</h2>
          <p class="font-body-sm text-body-sm text-on-surface-variant">
            Resume your flow. Sign in to your deep work workspace.
          </p>
        </div>
        <!-- Form -->
        <form action="#" class="space-y-6" onsubmit="event.preventDefault()">
          <!-- Email Field -->
          <div class="space-y-2 group">
            <label
              class="font-label-caps text-label-caps text-on-surface-variant group-focus-within:text-primary transition-colors"
              for="email"
              >EMAIL ADDRESS</label
            >
            <div class="relative flex items-center input-focus-effect rounded-lg">
              <span class="material-symbols-outlined absolute left-3 text-outline text-[20px]"
                >mail</span
              >
              <input
                class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-11 pr-4 font-body-sm text-body-sm text-on-surface placeholder:text-outline/50 focus:border-primary focus:ring-0 outline-none transition-all"
                id="email"
                placeholder="name@company.com"
                required=""
                type="email"
              />
            </div>
          </div>
          <!-- Password Field -->
          <div class="space-y-2 group">
            <div class="flex justify-between items-center">
              <label
                class="font-label-caps text-label-caps text-on-surface-variant group-focus-within:text-primary transition-colors"
                for="password"
                >PASSWORD</label
              >
              <a
                class="font-label-caps text-[10px] text-primary hover:underline transition-all"
                href="#"
                >FORGOT?</a
              >
            </div>
            <div class="relative flex items-center input-focus-effect rounded-lg">
              <span class="material-symbols-outlined absolute left-3 text-outline text-[20px]"
                >lock</span
              >
              <input
                class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-3 pl-11 pr-4 font-body-sm text-body-sm text-on-surface placeholder:text-outline/50 focus:border-primary focus:ring-0 outline-none transition-all"
                id="password"
                placeholder="••••••••"
                required=""
                type="password"
              />
            </div>
          </div>
          <!-- Action Button -->
          <button
            class="w-full bg-primary hover:bg-primary-container text-on-primary font-headline-md text-headline-md py-3.5 rounded-lg transition-all duration-200 transform active:scale-[0.98] flex items-center justify-center gap-2"
            type="submit"
          >
            Sign In
            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
          </button>
        </form>
        <!-- Social/Alt Auth Separation -->
        <div class="relative my-8">
          <div class="absolute inset-0 flex items-center">
            <div class="w-full border-t border-outline-variant"></div>
          </div>
          <div class="relative flex justify-center text-xs uppercase">
            <span class="bg-surface-container px-4 text-outline font-label-caps text-label-caps"
              >Or continue with</span
            >
          </div>
        </div>
        <!-- Social Button -->
        <button
          class="w-full border border-outline-variant hover:bg-surface-container-high text-on-surface font-body-sm text-body-sm py-3 rounded-lg transition-all duration-200 flex items-center justify-center gap-3"
        >
          <svg class="w-5 h-5" viewbox="0 0 24 24">
            <path
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              fill="currentColor"
            ></path>
            <path
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              fill="currentColor"
            ></path>
            <path
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              fill="currentColor"
            ></path>
            <path
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              fill="currentColor"
            ></path>
          </svg>
          Google
        </button>
      </div>
      <!-- Footer Links -->
      <footer class="mt-8 text-center space-y-4">
        <p class="font-body-sm text-body-sm text-on-surface-variant">
          Don't have an account?
          <a
            class="text-primary font-semibold hover:underline decoration-2 underline-offset-4"
            href="#"
            >Create workspace</a
          >
        </p>
        <div class="flex justify-center gap-6">
          <a
            class="font-label-caps text-label-caps text-outline hover:text-on-surface transition-colors"
            href="#"
            >Privacy Policy</a
          >
          <a
            class="font-label-caps text-label-caps text-outline hover:text-on-surface transition-colors"
            href="#"
            >Terms of Service</a
          >
        </div>
      </footer>
    </main>
    <!-- Decorative Subtle Element (Top Right) -->
    <div class="fixed top-0 right-0 w-96 h-96 opacity-10 pointer-events-none"></div>
    <script>
      // Micro-interactions for input fields
      document.querySelectorAll('input').forEach((input) => {
        input.addEventListener('focus', () => {
          input.parentElement.parentElement.classList.add('scale-[1.01]')
        })
        input.addEventListener('blur', () => {
          input.parentElement.parentElement.classList.remove('scale-[1.01]')
        })
      })

      // Subtle parallax on the card
      document.addEventListener('mousemove', (e) => {
        const card = document.querySelector('main div')
        const x = (window.innerWidth / 2 - e.pageX) / 50
        const y = (window.innerHeight / 2 - e.pageY) / 50
        card.style.transform = `translate(${x}px, ${y}px)`
      })
    </script>
  </body>
</html>
